[project]
name = "canna-agent"
version = "0.1.0"
description = "Evidence-grounded financial-product agent"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "langchain-naver>=0.1.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.tmp/pytest -p no:cacheprovider"
pythonpath = ["src"]
markers = [
    "real_data: uses ignored immutable local source data",
    "hcx_live: calls HyperCLOVA X and requires credentials and network",
    "deployment: exercises an external deployment environment",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pyshacl>=0.40.1",
    "pytest>=9.1.1",
    "rdflib>=7.6.0",
    "ruff>=0.16.5",
]
